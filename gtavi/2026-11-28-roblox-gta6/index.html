<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#000; }
      #root { position:relative; width:100%; height:100%; background:#000; }
      #inicio { position:absolute; inset:0; width:1080px; height:1920px; object-fit:cover; }
    </style>
  </head>
  <body>
    <!-- Meme "Roblox en serio te pasaste": inicio de Roblox -> página de "Grand Theft Auto VI" -> carga -> gameplay de GTA VI con botones de Roblox -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="16.6" data-width="1080" data-height="1920">
      <video id="inicio" class="clip" src="assets/footage/roblox/inicio-pagina.mp4" data-start="0" data-duration="5.45"
        data-track-index="0" muted playsinline></video>
      <div id="casilla" data-composition-id="casilla" data-composition-src="compositions/casilla.html" data-start="0"
        data-duration="2.6" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="pagina" data-composition-id="pagina" data-composition-src="compositions/pagina.html" data-start="0"
        data-duration="5.45" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="juego" data-composition-id="juego" data-composition-src="compositions/juego.html" data-start="7.3"
        data-duration="9.3" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="carga" style="z-index:2" data-composition-id="carga" data-composition-src="compositions/carga.html" data-start="5.45"
        data-duration="2.3" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="texto" style="z-index:3" data-composition-id="texto" data-composition-src="compositions/texto.html" data-start="0"
        data-duration="16.6" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>

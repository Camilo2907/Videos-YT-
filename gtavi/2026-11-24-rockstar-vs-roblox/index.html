<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#000; }
      #root { position:relative; width:100%; height:100%; background:#000; }
      /* gameplay horizontal centrado, con franjas negras arriba y abajo (como la referencia) */
      #gameplay { position:absolute; left:0; top:656px; width:1080px; height:608px; object-fit:cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.3" data-width="1080" data-height="1920">
      <video id="gameplay" class="clip" src="assets/footage/gameplay.mp4" data-start="0" data-duration="15.3"
        data-track-index="0" data-has-audio="true" playsinline></video>
      <div id="meme" data-composition-id="meme" data-composition-src="compositions/meme.html" data-start="0"
        data-duration="15.3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

<!doctype html>
<html><head><meta charset="utf-8">
<!-- Marca del canal xNeonVice: arte propio estilo Vice City (sin logos ni arte oficial de Rockstar).
     Se exporta con exportar.js: ?pieza=banner (2560x1440) o ?pieza=logo (800x800). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bebas+Neue&display=swap">
<style>
  :root{--pink:#ff4fa3;--pink2:#ff9ec9;--teal:#2ee6d6;--gold:#ffc861;--night:#170a2e;}
  html,body{margin:0;background:#000}
  .art{position:relative;overflow:hidden}
  #banner{width:2560px;height:1440px}
  #logo{width:800px;height:800px}
  svg{position:absolute;inset:0;width:100%;height:100%}
  .neon{font-family:"Bungee",Impact,sans-serif;color:#fff;
    text-shadow:0 0 6px #fff,0 0 18px var(--pink),0 0 42px var(--pink),0 0 90px var(--pink),0 8px 0 #7a1350}
  .sub{font-family:"Bebas Neue","Arial Narrow",sans-serif;color:var(--teal);
    text-shadow:0 0 10px rgba(46,230,214,.8),0 0 28px rgba(46,230,214,.5),0 3px 0 #0b3b44}
  /* banner text: inside YouTube's safe area (1546x423 centered) */
  #b-text{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  #b-name{font-size:206px;line-height:1;letter-spacing:.01em}
  #b-name .x{color:var(--gold);text-shadow:0 0 6px #fff4d6,0 0 20px var(--gold),0 0 50px #ff9a3d,0 8px 0 #7a3d10;font-size:.72em;vertical-align:.12em;margin-right:.04em}
  #b-sub{font-size:86px;letter-spacing:.22em;padding-left:.22em}
  #b-note{position:absolute;left:0;right:0;top:880px;text-align:center;font:600 30px/1 "Bebas Neue",sans-serif;letter-spacing:.2em;color:#fff;text-shadow:0 0 4px #2a0f45,0 0 10px #2a0f45,0 2px 2px #2a0f45}
  #l-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #l-name{font-size:300px;line-height:1;letter-spacing:-.02em;margin-top:40px}
  #l-name .x{color:var(--gold);text-shadow:0 0 6px #fff4d6,0 0 20px var(--gold),0 0 50px #ff9a3d,0 8px 0 #7a3d10;font-size:.5em;vertical-align:.5em;margin-right:.02em}
</style></head><body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140829"/><stop offset=".35" stop-color="#3b1366"/>
      <stop offset=".62" stop-color="#a3267f"/><stop offset=".8" stop-color="#ff5f7e"/><stop offset="1" stop-color="#ffb36b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1a8"/><stop offset=".45" stop-color="#ffb347"/><stop offset="1" stop-color="#ff3d8b"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a1a6e"/><stop offset=".5" stop-color="#23103f"/><stop offset="1" stop-color="#0e0620"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="rgba(255,170,120,.75)"/><stop offset="1" stop-color="rgba(255,90,150,0)"/>
    </radialGradient>
    <!-- palm silhouette, base at (0,0), height ~1000 -->
    <g id="palm" fill="#12061f">
      <path d="M-22 0 C -10 -300, 40 -650, 120 -960 L 146 -952 C 70 -650, 24 -300, 22 0 Z"/>
      <g transform="translate(133,-958)">
        <path d="M0 0 C -120 -90 -300 -80 -430 30 C -300 -30 -150 -20 0 18 Z"/>
        <path d="M0 0 C -90 -150 -260 -200 -380 -150 C -250 -140 -120 -80 0 14 Z"/>
        <path d="M0 0 C -20 -160 -110 -260 -220 -300 C -120 -220 -60 -120 -6 10 Z"/>
        <path d="M0 0 C 60 -170 180 -250 300 -250 C 190 -200 90 -110 8 12 Z"/>
        <path d="M0 0 C 130 -110 300 -120 420 -40 C 290 -70 150 -40 4 18 Z"/>
        <path d="M0 0 C 140 -20 290 40 380 160 C 260 70 130 40 0 22 Z"/>
        <path d="M0 0 C -130 0 -280 80 -350 200 C -240 100 -120 50 0 22 Z"/>
        <circle cx="0" cy="12" r="26"/>
      </g>
    </g>
  </defs>
</svg>

<!-- ============ BANNER 2560x1440 ============ -->
<div class="art" id="banner">
  <svg viewBox="0 0 2560 1440">
    <rect width="2560" height="1440" fill="url(#sky)"/>
    <!-- stars -->
    <g fill="#fff" opacity=".7">
      <circle cx="210" cy="120" r="2.5"/><circle cx="520" cy="230" r="2"/><circle cx="880" cy="90" r="3"/><circle cx="1240" cy="170" r="2"/>
      <circle cx="1650" cy="110" r="2.5"/><circle cx="1980" cy="210" r="2"/><circle cx="2330" cy="140" r="3"/><circle cx="2450" cy="330" r="2"/>
      <circle cx="120" cy="380" r="2"/><circle cx="1460" cy="300" r="1.8"/><circle cx="740" cy="360" r="1.8"/>
    </g>
    <ellipse cx="1280" cy="1040" rx="1300" ry="520" fill="url(#glow)"/>
    <!-- striped retro sun -->
    <clipPath id="sunclip"><rect x="0" y="0" width="2560" height="1065"/></clipPath>
    <mask id="stripes">
      <rect width="2560" height="1440" fill="#fff"/>
      <g fill="#000"><rect y="840" width="2560" height="10"/><rect y="878" width="2560" height="15"/><rect y="920" width="2560" height="20"/>
        <rect y="966" width="2560" height="25"/><rect y="1016" width="2560" height="30"/></g>
    </mask>
    <g clip-path="url(#sunclip)" mask="url(#stripes)">
      <circle cx="1280" cy="1065" r="470" fill="url(#sun)"/>
    </g>
    <!-- skyline -->
    <g fill="#2a0f45" opacity=".95">
      <path d="M300 1065 V1000 h60 v-40 h40 v40 h50 v-90 h70 v90 h40 v-60 h60 v60 h80 V1065 Z"/>
      <path d="M1720 1065 V990 h50 v-70 h60 v-50 h30 v50 h40 v120 h60 v-90 h70 v90 h50 v-40 h60 v65 Z"/>
    </g>
    <!-- sea with sun reflection -->
    <rect y="1065" width="2560" height="375" fill="url(#sea)"/>
    <g fill="#ffb36b" opacity=".55">
      <rect x="1060" y="1085" width="440" height="7" rx="3.5"/><rect x="1110" y="1118" width="340" height="6" rx="3"/>
      <rect x="1150" y="1152" width="260" height="6" rx="3"/><rect x="1190" y="1190" width="180" height="5" rx="2.5"/>
      <rect x="1225" y="1232" width="110" height="5" rx="2.5"/>
    </g>
    <g fill="#ff4fa3" opacity=".35"><rect x="700" y="1110" width="200" height="4"/><rect x="1700" y="1140" width="240" height="4"/><rect x="430" y="1200" width="160" height="4"/></g>
    <rect y="1062" width="2560" height="5" fill="#ff8fb3" opacity=".7"/>
    <!-- palms on the edges (outside the safe area) -->
    <use href="#palm" transform="translate(150,1440) scale(1.25)"/>
    <use href="#palm" transform="translate(420,1440) scale(.85) rotate(-6)"/>
    <use href="#palm" transform="translate(2410,1440) scale(-1.25,1.25)"/>
    <use href="#palm" transform="translate(2140,1440) scale(-.85,.85) rotate(-6)"/>
  </svg>
  <div id="b-text">
    <div id="b-name" class="neon"><span class="x">x</span>NEONVICE</div>
    <div id="b-sub" class="sub">GTA VI SPINS · GIVEAWAYS</div>
  </div>
  <div id="b-note">Not affiliated with Rockstar Games</div>
</div>

<!-- ============ LOGO 800x800 (YouTube lo muestra en círculo) ============ -->
<div class="art" id="logo">
  <svg viewBox="0 0 800 800">
    <rect width="800" height="800" fill="url(#sky)"/>
    <ellipse cx="400" cy="560" rx="520" ry="300" fill="url(#glow)"/>
    <mask id="lstripes"><rect width="800" height="800" fill="#fff"/>
      <g fill="#000"><rect y="470" width="800" height="9"/><rect y="500" width="800" height="13"/><rect y="534" width="800" height="17"/><rect y="572" width="800" height="21"/></g></mask>
    <clipPath id="lsunclip"><rect width="800" height="610"/></clipPath>
    <g clip-path="url(#lsunclip)" mask="url(#lstripes)"><circle cx="400" cy="610" r="270" fill="url(#sun)"/></g>
    <rect y="610" width="800" height="190" fill="url(#sea)"/>
    <rect y="608" width="800" height="4" fill="#ff8fb3" opacity=".7"/>
    <use href="#palm" transform="translate(70,800) scale(.62)"/>
    <use href="#palm" transform="translate(730,800) scale(-.62,.62)"/>
    <circle cx="400" cy="400" r="384" fill="none" stroke="#ff4fa3" stroke-width="14" opacity=".9"/>
    <circle cx="400" cy="400" r="366" fill="none" stroke="#2ee6d6" stroke-width="5" opacity=".9"/>
  </svg>
  <div id="l-text"><div id="l-name" class="neon"><span class="x">x</span>NV</div></div>
</div>

<script>
  const p = new URLSearchParams(location.search).get('pieza');
  if (p) document.querySelectorAll('.art').forEach(el => { if (el.id !== p) el.style.display = 'none'; });
</script>
</body></html>
